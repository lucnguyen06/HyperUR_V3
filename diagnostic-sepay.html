<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SePay Diagnostic Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0F172A;
            color: #F8FAFC;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #10b981; }
        h2 { margin-top: 20px; margin-bottom: 10px; color: #22D3EE; font-size: 16px; }
        .check { margin-bottom: 10px; padding: 10px; background: rgba(30, 41, 59, 0.8); border-radius: 5px; }
        .check-label { color: #CBD5E1; }
        .check-result { 
            display: inline-block;
            margin-left: 10px;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: bold;
        }
        .success { background: #10b981; color: white; }
        .error { background: #ef4444; color: white; }
        .warning { background: #f59e0b; color: white; }
        .info { background: #3b82f6; color: white; }
        pre {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 12px;
        }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 SePay Diagnostic Tool</h1>
        <p>Kiểm tra tất cả components SePay đã load đúng chưa</p>
        
        <button onclick="runDiagnostics()">🔍 Chạy Kiểm Tra</button>
        <button onclick="location.reload()">🔄 Reload</button>
        
        <div id="results"></div>
    </div>

    <script src="json/sepay-config.js"></script>
    <script src="json/sepay-handler.js"></script>
    
    <script>
        function runDiagnostics() {
            const results = document.getElementById('results');
            let html = '<h2>📋 Kết Quả Kiểm Tra</h2>';
            
            // 1. Check SEPAY_CONFIG
            html += '<div class="check">';
            html += '<span class="check-label">1. SEPAY_CONFIG</span>';
            if (window.SEPAY_CONFIG && Object.keys(window.SEPAY_CONFIG).length > 0) {
                html += '<span class="check-result success">✓ Loaded</span>';
                html += '<pre>Bank: ' + (window.SEPAY_CONFIG.BANK_INFO?.bankName || 'N/A') + '\n';
                html += 'Account: ' + (window.SEPAY_CONFIG.BANK_INFO?.accountNo || 'N/A') + '</pre>';
            } else {
                html += '<span class="check-result error">✗ Not Found</span>';
            }
            html += '</div>';
            
            // 2. Check SePayHandler
            html += '<div class="check">';
            html += '<span class="check-label">2. SePayHandler</span>';
            if (window.SePayHandler) {
                html += '<span class="check-result success">✓ Loaded</span>';
                html += '<pre>Methods: ' + Object.keys(window.SePayHandler).join(', ') + '</pre>';
            } else {
                html += '<span class="check-result error">✗ Not Found</span>';
            }
            html += '</div>';
            
            // 3. Check if can initialize
            html += '<div class="check">';
            html += '<span class="check-label">3. Can Initialize Payment</span>';
            if (window.SePayHandler && window.SePayHandler.initPayment) {
                html += '<span class="check-result success">✓ Yes</span>';
            } else {
                html += '<span class="check-result error">✗ No</span>';
            }
            html += '</div>';
            
            // 4. Check if can generate QR
            html += '<div class="check">';
            html += '<span class="check-label">4. Can Generate QR</span>';
            if (window.SePayHandler && window.SePayHandler.generateQRCode) {
                html += '<span class="check-result success">✓ Yes</span>';
            } else {
                html += '<span class="check-result error">✗ No</span>';
            }
            html += '</div>';
            
            // 5. Test initialization
            html += '<div class="check">';
            html += '<span class="check-label">5. Test Initialization</span>';
            try {
                if (window.SePayHandler && window.SePayHandler.initPayment) {
                    window.SePayHandler.initPayment('DIAG000001', 50000);
                    html += '<span class="check-result success">✓ Success</span>';
                    html += '<p>✅ Có thể tạo QR code để thanh toán</p>';
                } else {
                    html += '<span class="check-result error">✗ Failed</span>';
                    html += '<p>❌ SePayHandler không có method initPayment</p>';
                }
            } catch (e) {
                html += '<span class="check-result error">✗ Error</span>';
                html += '<pre>' + e.message + '</pre>';
            }
            html += '</div>';
            
            // 6. Check payment-detail-box
            html += '<div class="check">';
            html += '<span class="check-label">6. payment-detail-box Element</span>';
            const box = document.getElementById('payment-detail-box');
            if (box) {
                html += '<span class="check-result success">✓ Found</span>';
                html += '<pre>Element exists, ready to display QR</pre>';
            } else {
                html += '<span class="check-result warning">⚠ Not Found</span>';
                html += '<pre>Element #payment-detail-box not found on this page</pre>';
            }
            html += '</div>';
            
            // 7. Summary
            html += '<h2>📌 Tóm Tắt</h2>';
            if (window.SEPAY_CONFIG && window.SePayHandler) {
                html += '<div class="check">';
                html += '<span class="check-result success">✓ ALL SYSTEMS GO!</span>';
                html += '<p>Tất cả components đã load. SePay QR sẵn sàng hoạt động.</p>';
                html += '<p><strong>Nếu QR không hiện:</strong></p>';
                html += '<ul style="margin-left: 20px;">';
                html += '<li>Kiểm tra event listener được thêm vào</li>';
                html += '<li>Kiểm tra SePayHandler.initPayment() được gọi</li>';
                html += '<li>Kiểm tra browser console (F12) xem lỗi gì</li>';
                html += '</ul>';
                html += '</div>';
            } else {
                html += '<div class="check">';
                html += '<span class="check-result error">✗ MISSING COMPONENTS</span>';
                html += '<p>Một số files chưa load. Kiểm tra:</p>';
                html += '<ul style="margin-left: 20px;">';
                if (!window.SEPAY_CONFIG) html += '<li>json/sepay-config.js - CHECK THIS FIRST</li>';
                if (!window.SePayHandler) html += '<li>json/sepay-handler.js - CHECK THIS</li>';
                html += '</ul>';
                html += '</div>';
            }
            
            results.innerHTML = html;
        }
        
        // Auto-run on load
        window.addEventListener('load', runDiagnostics);
    </script>
</body>
</html>
