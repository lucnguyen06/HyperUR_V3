<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%">
  <defs>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="url(#artGrad)"/>

  <!-- Status Bar -->
  <text x="32" y="38" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff">09:41</text>
  <g transform="translate(300, 26)" fill="#ffffff">
    <path d="M12 3h3v10h-3z M6 6h3v7H6z M0 9h3v4H0z"/>
    <rect x="42" y="2" width="22" height="11" rx="3" fill="none" stroke="#fff" stroke-width="1.8"/>
    <rect x="44" y="4" width="15" height="7" rx="1.5" fill="#a855f7"/>
    <rect x="65" y="5" width="2" height="5" rx="1" fill="#fff"/>
  </g>

  <!-- Lockscreen Large Typography Clock with Depth -->
  <g transform="translate(195, 170)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="88" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">09:41</text>
    <text x="0" y="40" font-family="'Be Vietnam Pro', sans-serif" font-size="15" font-weight="600" fill="#cbd5e1" text-anchor="middle">Thứ Hai, 14 Tháng 9 • 28°C</text>
    
    <!-- Depth Wallpaper Effect Simulation -->
    <circle cx="0" cy="140" r="70" fill="url(#glowPurple)" opacity="0.4"/>
    <circle cx="0" cy="140" r="50" fill="url(#glowPurple)" opacity="0.6"/>
  </g>

  <!-- Customization Panel Bottom Sheet -->
  <g transform="translate(24, 460)">
    <rect width="342" height="320" rx="28" fill="rgba(15,23,42,0.92)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>
    <rect x="146" y="12" width="50" height="5" rx="2.5" fill="#64748b"/>

    <text x="24" y="46" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Tùy Biến Giao Diện Sâu</text>
    <text x="24" y="66" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#94a3b8">Chỉnh sửa font chữ tiếng Việt & Super Icon</text>

    <!-- Super Icon Grid Row -->
    <g transform="translate(24, 85)">
      <rect x="0" y="0" width="56" height="56" rx="18" fill="url(#glowPurple)"/>
      <text x="28" y="34" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">MI</text>

      <rect x="68" y="0" width="56" height="56" rx="18" fill="#3b82f6"/>
      <circle cx="96" cy="28" r="12" fill="#fff" opacity="0.3"/>

      <rect x="136" y="0" width="56" height="56" rx="18" fill="#10b981"/>
      <path d="M158 28l4 4 10-10" stroke="#fff" stroke-width="2.5" fill="none"/>

      <rect x="204" y="0" width="90" height="56" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="249" y="33" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">+ 200 Icon</text>
    </g>

    <!-- Font Option Row -->
    <g transform="translate(24, 165)">
      <rect x="0" y="0" width="294" height="54" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="16" y="32" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Font Tiếng Việt MiSans & Inter</text>
      <text x="278" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#a855f7" text-anchor="end">ÁP DỤNG</text>
    </g>

    <!-- Depth Effect Toggle -->
    <g transform="translate(24, 230)">
      <rect x="0" y="0" width="294" height="54" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="16" y="32" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Hiệu ứng chiều sâu Depth Wallpaper</text>
      <rect x="238" y="15" width="44" height="24" rx="12" fill="#a855f7"/>
      <circle cx="270" cy="27" r="9" fill="#ffffff"/>
    </g>
  </g>

  <!-- Bottom Home Indicator -->
  <rect x="135" y="828" width="120" height="5" rx="2.5" fill="#ffffff" opacity="0.4"/>
</svg>
