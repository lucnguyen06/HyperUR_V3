<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Google Drive API - HyperUR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0F172A;
            color: #F8FAFC;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #10b981;
        }
        .subtitle {
            color: #94A3B8;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .label {
            font-size: 13px;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .value {
            font-size: 14px;
            color: #F8FAFC;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        button {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 16px;
        }
        .status.loading {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }
        .status.success {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }
        .status.error {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .result {
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 8px;
            padding: 16px;
            max-height: 400px;
            overflow: auto;
        }
        pre {
            color: #CBD5E1;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .stat-box {
            background: rgba(15, 23, 42, 0.6);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.12);
        }
        .stat-label {
            font-size: 12px;
            color: #94A3B8;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Test Google Drive API - HyperUR</h1>
        <p class="subtitle">Kiểm tra kết nối Google Drive API để lấy danh sách ROM</p>

        <div class="card">
            <div class="label">API Endpoint (từ config.js)</div>
            <div class="value" id="api-url">Loading...</div>

            <div class="label">Trạng thái</div>
            <div id="status-container">
                <span class="status loading">Chưa kiểm tra</span>
            </div>

            <button id="test-btn" onclick="testAPI()">🚀 Test Kết Nối</button>
        </div>

        <div id="stats-container" style="display: none;">
            <div class="card">
                <h3 style="margin-bottom: 16px; color: #22D3EE;">📊 Thống Kê ROM</h3>
                <div class="stat-grid" id="stats-grid"></div>
            </div>
        </div>

        <div id="result-container" style="display: none;">
            <div class="card">
                <div class="label">Response Data</div>
                <div class="result">
                    <pre id="result-json"></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="json/config.js"></script>
    <script>
        const config = window.HYPERUR_CONFIG || {};
        const apiUrl = config.GOOGLE_DRIVE_API_URL || 'CHƯA CẤU HÌNH';
        
        document.getElementById('api-url').textContent = apiUrl;

        async function testAPI() {
            const statusContainer = document.getElementById('status-container');
            const resultContainer = document.getElementById('result-container');
            const statsContainer = document.getElementById('stats-container');
            const resultJson = document.getElementById('result-json');
            const statsGrid = document.getElementById('stats-grid');
            const testBtn = document.getElementById('test-btn');

            if (!config.GOOGLE_DRIVE_API_URL || config.GOOGLE_DRIVE_API_URL.trim() === '') {
                statusContainer.innerHTML = '<span class="status error">❌ Lỗi: Chưa cấu hình API URL trong config.js</span>';
                return;
            }

            testBtn.disabled = true;
            statusContainer.innerHTML = '<span class="status loading">⏳ Đang kết nối Google Drive API...</span>';
            resultContainer.style.display = 'none';
            statsContainer.style.display = 'none';

            try {
                const startTime = Date.now();
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout

                const reqUrl = apiUrl + (apiUrl.includes('?') ? '&' : '?') + '_t=' + Date.now();
                
                const response = await fetch(reqUrl, {
                    signal: controller.signal,
                    cache: 'no-store'
                });
                
                clearTimeout(timeoutId);
                const endTime = Date.now();
                const duration = endTime - startTime;

                if (response.ok) {
                    const data = await response.json();
                    
                    if (data && !data.error && Object.keys(data).length > 0) {
                        // Success
                        statusContainer.innerHTML = `<span class="status success">✅ Kết nối thành công! (${duration}ms)</span>`;
                        
                        // Display JSON
                        resultJson.textContent = JSON.stringify(data, null, 2);
                        resultContainer.style.display = 'block';

                        // Calculate stats
                        let totalDevices = 0;
                        let totalRoms = 0;
                        let devicesByRegion = {};

                        for (const [codename, deviceData] of Object.entries(data)) {
                            if (deviceData && deviceData.roms) {
                                totalDevices++;
                                const romsCount = Object.keys(deviceData.roms).length;
                                totalRoms += romsCount;

                                for (const region of Object.keys(deviceData.roms)) {
                                    devicesByRegion[region] = (devicesByRegion[region] || 0) + 1;
                                }
                            }
                        }

                        // Display stats
                        statsGrid.innerHTML = `
                            <div class="stat-box">
                                <div class="stat-label">Tổng thiết bị có ROM</div>
                                <div class="stat-value">${totalDevices}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Tổng file ROM</div>
                                <div class="stat-value">${totalRoms}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Thời gian response</div>
                                <div class="stat-value">${duration}<span style="font-size: 14px;">ms</span></div>
                            </div>
                        `;

                        if (Object.keys(devicesByRegion).length > 0) {
                            const regionStats = Object.entries(devicesByRegion)
                                .map(([region, count]) => `
                                    <div class="stat-box">
                                        <div class="stat-label">Region: ${region.toUpperCase()}</div>
                                        <div class="stat-value">${count}</div>
                                    </div>
                                `)
                                .join('');
                            statsGrid.innerHTML += regionStats;
                        }

                        statsContainer.style.display = 'block';

                    } else {
                        statusContainer.innerHTML = `<span class="status error">⚠️ API trả về dữ liệu rỗng hoặc có lỗi</span>`;
                        resultJson.textContent = JSON.stringify(data, null, 2);
                        resultContainer.style.display = 'block';
                    }
                } else {
                    statusContainer.innerHTML = `<span class="status error">❌ HTTP Error: ${response.status} ${response.statusText}</span>`;
                    const errorText = await response.text();
                    resultJson.textContent = errorText;
                    resultContainer.style.display = 'block';
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    statusContainer.innerHTML = '<span class="status error">⏱️ Timeout: API không phản hồi sau 15 giây</span>';
                } else {
                    statusContainer.innerHTML = `<span class="status error">❌ Lỗi: ${error.message}</span>`;
                }
                resultJson.textContent = error.toString();
                resultContainer.style.display = 'block';
            } finally {
                testBtn.disabled = false;
            }
        }

        // Auto test on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (config.GOOGLE_DRIVE_API_URL && config.GOOGLE_DRIVE_API_URL.trim() !== '') {
                    console.log('🚀 Auto-testing Google Drive API...');
                    testAPI();
                }
            }, 500);
        });
    </script>
</body>
</html>
